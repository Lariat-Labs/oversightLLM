name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml

permissions:
  contents: read

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w ."; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build -o bin/oversight ./cmd/oversight && ./bin/oversight version

  web:
    name: Frontend (React web component)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: build
        run: npm run build

  versions:
    name: Versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: VERSION matches web/package.json
        run: |
          v=$(cat VERSION); p=$(node -p "require('./web/package.json').version")
          [ "$v" = "$p" ] || { echo "VERSION=$v but web/package.json=$p (use make release)"; exit 1; }

  openapi:
    name: OpenAPI spec is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: regenerate and diff
        run: |
          python3 scripts/gen_openapi.py api/internal/server/openapi.json
          git diff --exit-code api/internal/server/openapi.json || { echo "openapi.json is stale: run make openapi"; exit 1; }
